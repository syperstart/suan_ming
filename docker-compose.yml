# ============================================================
#  陈大师服务 —— 一键启动配置
#
#  ★ 三条最常用的命令（在本文件所在目录执行）
#    启动（首次会自动构建镜像）：docker compose up -d --build
#    看实时日志：              docker compose logs -f
#    停止并移除容器：          docker compose down
#
#  ★ 跑起来之后
#    电脑访问： http://127.0.0.1:8000/h5
#    手机访问： http://电脑的局域网IP:8000/h5 （手机和电脑同一个 WiFi）
#
#  ★ 密钥从哪来？
#    本文件只写 "变量名"，真实密钥放在同目录的 .env 文件里。
#    .env 已被 .gitignore 排除，永远不会上传到 git。
#    第一次用：把 .env.example 复制成 .env，再把密钥填进去。
# ============================================================

# ★ 项目名：必须写！Docker 默认拿"目录名"当项目名，
#   而咱们的目录名带中文（智能体项目），它会算成一个空名字并报
#   "project name must not be empty"。写上这行就彻底避开这个坑。
name: chen-master

services:
  chen:
    build: .                      # 用当前目录的 Dockerfile 构建镜像
    image: chen-master:1.0        # 给镜像起个名字，方便在 docker images 里找到它
    container_name: chen_master   # 容器名字，日志和 docker ps 里一眼能认出来
    restart: unless-stopped       # 程序崩了、或 Docker 重启，都会自动把它拉起来

    ports:
      # 左边 = 宿主机端口（想改用 8080 就写成 "8080:8000"）；右边 = 容器内端口，别动
      - "8000:8000"

    environment:
      # ---------- 改配置就在这里改，不用动代码 ----------
      # ★ 密钥都从 .env 文件读（见文件顶部的说明），不要写死在这里！
      #   ${API_KEY:?提示语} 的意思是：如果没配就报错并显示提示语，避免"静默失败"
      API_KEY: "${API_KEY:?请先复制 .env.example 为 .env，并在里面填上 API_KEY}"
      MODEL_NAME: "${MODEL_NAME:-deepseek-v4-flash-vision-exp}"
      BASE_URL: "${BASE_URL:-https://api.deepseek.com}"
      # 联网搜索用的博查密钥。没申请就留空，不影响算命、八字、知识库等功能
      BOCHA_API_KEY: "${BOCHA_API_KEY:-}"

      # ---------- 数据放在容器里的哪个目录 ----------
      # 这两个要和下面 volumes 的挂载路径对上，一般不改
      MEMORY_DIR: "/app/data/memory"        # 聊天记忆
      DB_PATH: "/app/data/local_qdrant"     # 知识库（向量数据库）

      # 国内下载模型走镜像站；网络通畅/在国外可以删掉这行
      HF_ENDPOINT: "https://hf-mirror.com"
      TZ: "Asia/Shanghai"

    volumes:
      # ★★ 用「Docker 自己管理的卷」（named volume），不用 ./data 这种本机目录。
      #    原因：本机是 Windows，把 D 盘目录直接挂进 Linux 容器要靠文件共享转发，
      #    实测会出现"程序以为写进去了、外面却看不到"的情况，一重启容器数据就没了。
      #    named volume 存在 Docker 自己的存储里，最稳，换台机器部署也一样。
      - chen_memory:/app/data/memory          # 聊天记忆
      - chen_qdrant:/app/data/local_qdrant    # 知识库
      - chen_hf:/root/.cache/huggingface      # 中文嵌入模型缓存（省得每次重建都重下）

# 声明上面用到的三个卷（Docker 会自动创建并一直保留，直到你手动删）
volumes:
  chen_memory:
  chen_qdrant:
  chen_hf:
